// PCA 30/09/2026 — bron: MAKE_X1/vervolgdag_pagina.js (niet hier bewerken, opnieuw genereren met build_pagina_vervolgdag.py)
// vervolgdag_pagina.js (PCA 30/09/2026, go Wim) — vertaalstap voor meerdaagse Calendly-boekingen als STATISCHE pagina
// (GitHub Pages, repo AquaGit-tech/aquaproved-email-templates, pad calendly/volgende-dag.html). Sneller dan Make 04.9.
// Draait in de browser van de klant; bevat GEEN sleutels en zoekt niets op.
//
// Calendly (Confirmation page → Redirect + "Pass event details") stuurt: invitee_first/last/full_name, invitee_email, answer_1..10,
// event_start_time, event_type_uuid, utm_* (+ onze vaste ?e=<slug>). Calendly's boekingspagina leest name/email/a1..a10/utm_*/date.
// Telling zonder opzoeken, via de link zelf:
//   utm_term     = aantal werkdagen (zet de planningsmail; 2..10)          → blijft ongewijzigd in de keten
//   utm_campaign = "dagen:" + geboekte datums (YYYYMMDD, met ".")          → elke stap voegt de net geboekte dag toe
// Genoeg dagen → bevestiging tonen; anders terug naar hetzelfde event, alles ingevuld, kalender op de volgende werkdag.
// Bibliotheek (Wim 30/09): links van vóór 30/09 dragen geen utm_term. Dan komt het aantal uit BIB (build_vervolgdag_bibliotheek.py,
// bron Teamleader: deals in fase Planningsmail, veld C = werkduur): eerst op dealnummer (utm_content, links sinds 24/09),
// anders op vingerafdruk van het e-mailadres (mailHash; geen adressen op de openbare pagina). Onbekend → keuzescherm.

var PROFIEL = "https://calendly.com/aquaproved";
var DAGEN = ["zondag", "maandag", "dinsdag", "woensdag", "donderdag", "vrijdag", "zaterdag"];
var MAANDEN = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];

function isoDag(start) {
  var m = String(start || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[1] + m[2] + m[3] : "";
}

function volgendeWerkdag(dag) {   // dag = YYYYMMDD → YYYY-MM-DD van de volgende werkdag (ma-vr)
  if (!/^\d{8}$/.test(dag)) return "";
  var d = new Date(Date.UTC(+dag.slice(0, 4), +dag.slice(4, 6) - 1, +dag.slice(6, 8)));
  do { d.setUTCDate(d.getUTCDate() + 1); } while (d.getUTCDay() === 0 || d.getUTCDay() === 6);
  return d.toISOString().slice(0, 10);
}

function leesKeten(campaign) {
  var m = String(campaign || "").match(/^dagen:([\d.]*)$/);
  if (!m || !m[1]) return [];
  return m[1].split(".").filter(function (x) { return /^\d{8}$/.test(x); });
}

function datumNl(dag) {
  var d = new Date(Date.UTC(+dag.slice(0, 4), +dag.slice(4, 6) - 1, +dag.slice(6, 8)));
  return DAGEN[d.getUTCDay()] + " " + d.getUTCDate() + " " + MAANDEN[d.getUTCMonth()] + " " + d.getUTCFullYear();
}

function basisUrl(p, tabel) {
  var e = String(p.e || "").trim().toLowerCase();
  if (/^[a-z0-9-]{3,120}$/.test(e)) return PROFIEL + "/" + e;
  var uuid = String(p.event_type_uuid || "").trim();
  if (uuid && tabel && tabel[uuid]) return tabel[uuid];
  return "";
}

// p = object met de queryparameters; geeft { soort: "terug"|"klaar"|"onbekend", url, dagen[], voornaam }
function geldig(x) { x = parseInt(String(x == null ? "" : x), 10); return (x >= 2 && x <= 10) ? x : 0; }

// p = queryparameters (+ optioneel p._mailhash, door de pagina berekend); bib = { deal: {uuid: n}, mail: {hash: n} }
function aantalDagen(p, bib) {
  var n = geldig(p.utm_term);
  if (n) return n;
  bib = bib || {};
  var d = String(p.utm_content || "").trim().toLowerCase();
  if (d && bib.deal && bib.deal[d]) return geldig(bib.deal[d]);
  if (p._mailhash && bib.mail && bib.mail[p._mailhash]) return geldig(bib.mail[p._mailhash]);
  return 0;
}

// geeft { soort: "terug"|"klaar"|"kies"|"onbekend", url, dagen[], voornaam }
function verwerk(p, tabel, bib) {
  var dagen = leesKeten(p.utm_campaign);
  var nu = isoDag(p.event_start_time);
  if (nu && dagen.indexOf(nu) < 0) dagen.push(nu);
  dagen.sort();
  var n = aantalDagen(p, bib);
  var voornaam = String(p.invitee_first_name || String(p.invitee_full_name || "").split(" ")[0] || "").trim();
  if (n && dagen.length >= n) return { soort: "klaar", url: "", dagen: dagen, voornaam: voornaam };

  var basis = basisUrl(p, tabel);
  if (!basis) return { soort: "onbekend", url: PROFIEL, dagen: dagen, voornaam: voornaam };
  var q = [];
  function zet(k, v) { v = String(v == null ? "" : v).trim(); if (v) q.push(k + "=" + encodeURIComponent(v)); }
  var vn = String(p.invitee_first_name || "").trim(), an = String(p.invitee_last_name || "").trim();
  zet("name", String(p.invitee_full_name || "").trim() || [vn, an].filter(Boolean).join(" "));
  zet("first_name", vn);
  zet("last_name", an);
  zet("email", p.invitee_email);
  for (var i = 1; i <= 10; i++) zet("a" + i, p["answer_" + i]);
  zet("utm_source", p.utm_source);
  zet("utm_medium", p.utm_medium);
  zet("utm_content", p.utm_content);
  zet("utm_term", n || "");   // eenmaal gevonden (link of bibliotheek) reist het aantal mee in de keten
  if (dagen.length) zet("utm_campaign", "dagen:" + dagen.join("."));
  var volgende = volgendeWerkdag(dagen.length ? dagen[dagen.length - 1] : "");
  if (volgende) { zet("month", volgende.slice(0, 7)); zet("date", volgende); }
  var url = basis + (q.length ? "?" + q.join("&") : "");
  // aantal onbekend (bv. syndicus met ander adres): niet eindeloos terugsturen, de klant kiest zelf
  return { soort: n ? "terug" : "kies", url: url, dagen: dagen, voornaam: voornaam };
}

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function klaarInhoud(r) {
  var lijst = r.dagen.map(function (d) { return "<li>" + esc(datumNl(d)) + "</li>"; }).join("");
  var n = r.dagen.length;
  return "<div class='v'>&#10003;</div><h1>Bevestigd</h1>" +
    "<p>" + (r.voornaam ? esc(r.voornaam) + ", u" : "U") + "w " + (n === 1 ? "werkdag is" : n + " werkdagen zijn") + " ingepland:</p>" +
    "<ul>" + lijst + "</ul><p>U ontvangt per dag een bevestiging per e-mail.</p><p class='s'>U mag dit venster sluiten.</p>";
}

function kiesInhoud(r) {
  var lijst = r.dagen.map(function (d) { return "<li>" + esc(datumNl(d)) + "</li>"; }).join("");
  return "<div class='v'>&#10003;</div><h1>Geboekt</h1>" +
    "<p>" + (r.voornaam ? esc(r.voornaam) + ", u" : "U") + " heeft ingepland:</p><ul>" + lijst + "</ul>" +
    "<p>Duren de werken nog een dag langer?</p>" +
    "<p><a class='knop' href='" + esc(r.url) + "'>Volgende aansluitende dag inplannen</a></p>" +
    "<p><a class='knop2' href='#' id='klaar'>Ik ben klaar</a></p>";
}

function params(search) {
  var p = {};
  String(search || "").replace(/^\?/, "").split("&").forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf("=");
    var k = decodeURIComponent((i < 0 ? kv : kv.slice(0, i)).replace(/\+/g, " "));
    var v = i < 0 ? "" : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " "));
    p[k] = v;
  });
  return p;
}
